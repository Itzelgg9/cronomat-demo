<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#364f8a">
<title>Cronomat Organizer — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="css/style.css?v=0fc0927c06">
</head>
<body>

  <!-- ---------- Acceso ---------- -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-arte" aria-hidden="true">
      <span class="mancha m1"></span>
      <span class="mancha m2"></span>
      <span class="mancha m3"></span>
    </div>

    <form class="login-box" id="login-form">
      <img class="logo-login" src="img/logo-conamat.png"
           alt="CONAMAT · Colegio Nacional de Matemáticas, plantel Hidalgo - San Cosme">
      <div class="login-titulo">
        <h1>Cronomat</h1>
        <p class="login-hint">Organizador de horarios académicos</p>
      </div>

      <div class="field">
        <label for="login-usuario">Usuario</label>
        <input type="text" id="login-usuario" autocomplete="username" autofocus required placeholder="tu.usuario">
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••">
      </div>

      <div class="login-error hidden" id="login-error"></div>
      <button class="btn btn-bloque" type="submit" id="login-submit">Entrar</button>
      <div class="demo-cuentas" id="demo-cuentas"></div>
    </form>
  </div>

  <!-- ---------- Aplicación ---------- -->
  <div class="app-shell hidden" id="app-shell">

    <div class="velo" id="velo" hidden></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-cabeza">
        <div class="brand">
          <img class="logo-lateral" src="img/logo-conamat@2x.png" alt="CONAMAT">
          <span class="brand-sub">Cronomat</span>
        </div>
        <button class="icono-btn solo-movil" id="btn-cerrar-menu" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <nav class="tabs" id="tabs"></nav>

      <div class="sidebar-pie">
        <button class="tema-btn" id="btn-tema" title="Cambiar tema">
          <svg class="ic-claro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="ic-oscuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <span class="tema-txt">Tema</span>
        </button>

        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar"></div>
          <div class="user-info">
            <span class="user-name" id="user-name"></span>
            <span class="user-role" id="user-role"></span>
          </div>
        </div>

        <div class="sidebar-acciones">
          <button class="btn secondary small" id="btn-password">Contraseña</button>
          <button class="btn ghost small" id="btn-logout">Salir</button>
        </div>
      </div>
    </aside>

    <div class="contenido">
      <header class="topbar-movil">
        <button class="icono-btn" id="btn-menu" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>
        <img class="logo-movil" src="img/logo-conamat@2x.png" alt="CONAMAT">
        <div class="user-avatar chico" id="user-avatar-movil"></div>
      </header>

      <main id="view-root" class="view-root"></main>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal-box"></div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/datos.js?v=98047ed5fd"></script>
  <script src="js/demo.js?v=52f2592d93"></script>
  <script src="js/app.js?v=03f2b3fa36"></script>
  <div class="demo-sello-flotante" id="demo-sello-flotante" hidden>
    <span class="demo-sello">DEMO</span>
    <span class="demo-txt">Datos de muestra, solo consulta</span>
  </div>
</body>
</html>
